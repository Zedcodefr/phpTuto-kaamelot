; Configuration de DÉVELOPPEMENT uniquement
date.timezone = Europe/Paris
memory_limit = 512M
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; OPcache : PHP compile chaque script en opcodes, OPcache les garde en mémoire.
; En dev on revalide à chaque requête pour voir ses modifications immédiatement.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug (debugger pas-à-pas, comme dans Visual Studio / Rider).
; Désactivé par défaut (lent). Activer avec : XDEBUG_MODE=debug make up
; (la variable d'environnement XDEBUG_MODE surcharge cette valeur)
xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
