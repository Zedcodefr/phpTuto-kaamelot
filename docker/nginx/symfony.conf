# nginx joue le rôle du reverse proxy (comme IIS / un reverse proxy devant Kestrel).
# Il sert les fichiers statiques et transmet tout le reste à PHP-FPM via le protocole FastCGI.
server {
    listen 80;
    root /app/public;

    # DNS interne de Docker : l'IP du conteneur PHP-FPM est re-résolue toutes les 10 s,
    # sinon nginx garde l'IP vue au démarrage et renvoie 502 si api-symfony est recréé.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream api-symfony:9000;

    location / {
        # Si le fichier n'existe pas physiquement -> front controller Symfony
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Passer par une variable force la résolution DNS à l'exécution (via "resolver")
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Interdit l'exécution de tout autre fichier .php
    location ~ \.php$ {
        return 404;
    }
}
